name: Préparer un test propre GitHub Basics

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reset-fresh-test.yml"

permissions:
  actions: write
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Nettoyer les branches et réactiver Step 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/my-first-branch" || true

          for workflow in             1-create-a-branch.yml             2-commit-a-file.yml             3-open-a-pull-request.yml             4-merge-your-pull-request.yml; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$workflow" --jq '.state' 2>/dev/null || true)"
            if [ "$state" = "active" ]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/$workflow/disable"
            fi
          done

          step0="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/0-start-exercise.yml" --jq '.state' 2>/dev/null || true)"
          if [ "$step0" != "active" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/0-start-exercise.yml/enable"
          fi
