name: Reset V1 audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reset-for-v1-audit.yml"

permissions:
  actions: write
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt de test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: target
          fetch-depth: 0

      - name: Récupérer le template canonique
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ENSTARobotics/tutorial-github-basics
          ref: main
          path: source

      - name: Réinitialiser le contenu hors workflows
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows/' \
            source/ target/

      - name: Committer la réinitialisation
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Réinitialiser le contenu pour le test V1"
            git push
          fi

      - name: Préparer la machine à états
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/my-first-branch" || true
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/0-start-exercise.yml/enable" || true
